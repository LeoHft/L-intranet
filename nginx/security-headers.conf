# Ce fichier est inclus dans chaque location qui utilise add_header :
# nginx n'hérite pas des add_header du bloc parent dès qu'un location en définit un.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Pas de includeSubDomains : cela casserait d'autres services auto-hébergés en HTTP sur des sous-domaines.
add_header Strict-Transport-Security "max-age=31536000" always;
