user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 48M;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript
               application/xml+rss application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirection HTTP vers HTTPS
    server {
        listen 80;
        server_name ${SERVER_NAME};
        return 301 https://$host:${HTTPS_PORT}$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ${SERVER_NAME};

        # Résolveur Docker : nginx retrouve les conteneurs même après leur recréation.
        resolver 127.0.0.11 valid=30s;

        ssl_certificate /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        include /etc/nginx/security-headers.conf;

        # API Laravel : seul public/index.php peut être exécuté.
        location /api/ {
            set $backend intranet-backend:9000;
            fastcgi_pass $backend;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_param HTTPS on;

            fastcgi_buffer_size 32k;
            fastcgi_buffers 8 16k;
            fastcgi_busy_buffers_size 64k;
            fastcgi_read_timeout 60s;
        }

        # Fichiers cachés du dossier d'envoi (.gitignore...)
        location ~ ^/storage/(.*/)?\. {
            deny all;
        }

        # Images envoyées : servies comme fichiers statiques, jamais exécutées ni interprétées.
        location /storage/ {
            alias /var/www/storage/;
            include /etc/nginx/security-headers.conf;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Cache-Control "public, max-age=2592000";
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Frontend : frontend.prod.conf ou frontend.dev.conf selon NGINX_MODE
        include /etc/nginx/frontend.conf;
    }
}
