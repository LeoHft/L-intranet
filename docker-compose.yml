# Production. Lancez ./setup.sh pour générer le fichier .env, puis : docker compose up -d --build
# Mode développement : voir docker-compose.dev.yml

services:
  ssl-init:
    build: ./ssl
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - ./ssl/certs:/ssl

  intranetDB:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Fichier .env incomplet, lancez ./setup.sh}
      MARIADB_DATABASE: intranet
      MARIADB_USER: ${DB_USERNAME:-intranet}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Fichier .env incomplet, lancez ./setup.sh}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./intranetDB_data:/var/lib/mysql
    networks:
      - intranet

  intranet-backend:
    build:
      context: ./intranet-backend
      target: prod
    restart: unless-stopped
    depends_on:
      intranetDB:
        condition: service_healthy
    environment:
      APP_NAME: intranet-backend
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOCALE: fr
      APP_URL: ${APP_URL:-https://localhost}
      APP_KEY: ${APP_KEY:?Fichier .env incomplet, lancez ./setup.sh}
      JWT_SECRET: ${JWT_SECRET:?Fichier .env incomplet, lancez ./setup.sh}
      JWT_TTL: ${JWT_TTL:-20160} # 2 semaines, en minutes
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DB_CONNECTION: mariadb
      DB_HOST: intranetDB
      DB_PORT: 3306
      DB_DATABASE: intranet
      DB_USERNAME: ${DB_USERNAME:-intranet}
      DB_PASSWORD: ${DB_PASSWORD}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_DRIVER: array
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 180s
    volumes:
      - ./intranet-backend/storage/app/public:/var/www/html/storage/app/public
    networks:
      - intranet

  nginx:
    build:
      context: ./intranet-frontend
      target: prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      ssl-init:
        condition: service_completed_successfully
      intranet-backend:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      NGINX_MODE: prod
    entrypoint: ["/bin/sh", "/opt/nginx/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - ./nginx:/opt/nginx:ro
      - ./ssl/certs:/etc/nginx/ssl:ro
      - ./intranet-backend/storage/app/public:/var/www/storage:ro
    networks:
      - intranet

networks:
  intranet:
    driver: bridge
